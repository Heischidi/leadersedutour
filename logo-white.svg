<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <clipPath id="globeClipW">
      <circle cx="68" cy="70" r="58"/>
    </clipPath>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8960A"/>
      <stop offset="100%" style="stop-color:#FBBC2A"/>
    </linearGradient>
  </defs>

  <!-- Globe: semi-transparent white body on dark bg -->
  <circle cx="68" cy="70" r="58" fill="rgba(255,255,255,0.12)"/>
  <!-- Globe border -->
  <circle cx="68" cy="70" r="58" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Globe: Green upper hemisphere -->
  <ellipse cx="68" cy="42" rx="46" ry="40" fill="#55CC33" clip-path="url(#globeClipW)"/>
  <ellipse cx="68" cy="28" rx="38" ry="28" fill="#60D840" clip-path="url(#globeClipW)"/>

  <!-- Gold swoosh -->
  <path d="M 18 88 Q 12 118 46 126 Q 82 130 110 106"
        fill="none" stroke="url(#goldGradW)" stroke-width="9" stroke-linecap="round"/>

  <!-- Gold arrow head -->
  <polygon points="108,91 124,107 98,116" fill="#F5A623"/>

  <!-- "LESTL" in white -->
  <text x="145" y="82"
        font-family="'Arial Black', 'Arial', 'Helvetica Neue', sans-serif"
        font-weight="900"
        font-size="62"
        fill="#FFFFFF"
        letter-spacing="1">LESTL</text>

  <!-- "Leaders Educational" in white -->
  <text x="147" y="103"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-weight="700"
        font-size="18"
        fill="#FFFFFF">Leaders Educational</text>

  <!-- "Services &amp; Tours Ltd" in gold -->
  <text x="147" y="126"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-weight="700"
        font-size="18"
        fill="#F5A623">Services &amp; Tours Ltd</text>
</svg>
